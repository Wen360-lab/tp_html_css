<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../CSS/flexbox.css">
    <title>Flexbox</title>
</head>
<body>
    <main>
        <!-- <!-- 🔹 Exercice 1 — Centrage parfait
        
        Objectif : maîtriser les bases
        
        Crée une div .container contenant une div .box.
        
        👉 Contraintes :
        
        .box doit être centrée horizontalement ET verticalement
        Taille de .container : height: 100vh -->
        <div class="container">
            <div class="box"></div>
        </div>
        <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
        
        
        
        
        <!-- 🔹 Exercice 2 — Navigation horizontale
        
        Objectif : alignement en ligne
        
        Crée une navbar avec 5 liens.
        
        👉 Contraintes :
        
        Les liens doivent être alignés horizontalement
        Espacés de manière égale
        Centrés verticalement dans la navbar -->
        <div class="navbar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Pages</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
        <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
        
        
        
        
        <!-- 🔹 Exercice 3 — Card layout simple
        
        Objectif : alignement en colonne
        
        Crée une carte avec :
        
        un titre
        un texte
        un bouton
        
        👉 Contraintes :
        
        Tout doit être en colonne
        Espacement régulier entre les éléments -->
        <div class="cardExo3">
            <h3 class="titreExo3">Ceci est le titre</h3>
            <p class="paraExo3">Ceci est un petit paragraphe relatif à l'exercice 3 <br>Qui conciste à créer une card en flex-direction column <br>et d'y mettre un titre, un paragraphe et un bouton.</p>
            <button class="btnExo3">CLique ici</button>
        </div>
        <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
        
        
        
        
        <!-- 🔹 Exercice 4 — Grille flexible
        
        Objectif : comprendre flex-wrap
        
        Crée une liste de 10 blocs.
        
        👉 Contraintes :
        
        Les blocs doivent passer à la ligne automatiquement
        Largeur fixe (ex: 150px)
        Espacement entre les éléments -->
        <div class="containerlist">
            <div class="bloc bloc1"></div>
            <div class="bloc bloc2"></div>
            <div class="bloc bloc3"></div>
            <div class="bloc bloc4"></div>
            <div class="bloc bloc5"></div>
            <div class="bloc bloc6"></div>
            <div class="bloc bloc7"></div>
            <div class="bloc bloc8"></div>
            <div class="bloc bloc9"></div>
            <div class="bloc bloc10"></div>
        </div>
        <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
        
        
        
        
        <!-- 🔹 Exercice 5 — Justify-content avancé
        
        Objectif : distribution de l’espace
        
        Crée 4 blocs dans un container.
        
        👉 Teste les valeurs :
        
        space-between
        space-around
        space-evenly
        
        👉 Analyse visuellement la différence -->
        <div class="containerExo5">
            <div class="blocExo5 elmt1"></div>
            <div class="blocExo5 elmt2"></div>
            <div class="blocExo5 elmt3"></div>
            <div class="blocExo5 elmt4"></div>
        </div>
        <!-- -------------------------------------------------------------------------------------------------------------------------------------------------------- -->
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    <button class="btn">
        <a href="../../index.html">Retour à la nav</a>
    </button>

    </main>
</body>
</html>
