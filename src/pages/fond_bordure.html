<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../CSS/fond_bordure.css">
    <title>Fond et bordures</title>
</head>
<body>
    <main>
        <!-- Exercice 1 — Couleur de fond simple
        
        Crée une div avec :
        
        une largeur de 300px
        une hauteur de 150px
        une couleur de fond bleue
        
        <!-- Objectif : maîtriser background-color -->
        <div class="boxExo1"></div>
        <!-- --------------------------------------------------------------------------------------------------------------------------------------------- -->
        
        
        
        <!-- Exercice 2 — Image de fond
        
        Ajoute une image de fond à une div :
        
        taille : 400x200px
        image centrée
        pas de répétition
        
        Objectif : background-image, background-position, background-repeat -->
        <div class="imgFondExo2"></div>
        <!-- --------------------------------------------------------------------------------------------------------------------------------------------- -->
        


        <!--  Exercice 3 — Image de fond responsive
        
        Reprends l’exercice 2 et :
        
        fais en sorte que l’image couvre toute la div
        garde les proportions
        
         Objectif : background-size: cover -->
         <!-- Voir la résoulution sur la page et le code fond_bordure.css -->
         <!-- --------------------------------------------------------------------------------------------------------------------------------------------- -->
         
         
         
         <!-- Exercice 4 — Dégradé simple
         
         Crée une div avec :
         
         un dégradé horizontal du rouge vers le jaune
         
         Objectif : linear-gradient -->
         <div class="boxExo4"></div>
         <!-- --------------------------------------------------------------------------------------------------------------------------------------------- -->
         
         
         
         <!-- Exercice 5 — Dégradé avancé
         
         Crée un fond avec :
         
         un dégradé en diagonale
         3 couleurs différentes
         
         Objectif : maîtriser les angles et multi-colors -->
         <div class="boxExo5"></div>
         <!-- --------------------------------------------------------------------------------------------------------------------------------------------- -->
         

         
         <!-- Exercice 6 — Bordure simple
         
         Crée une div avec :
         
         une bordure noire de 2px
         style solide
         
         Objectif : border -->
         <div class="bordureExo6"></div>
         <!-- --------------------------------------------------------------------------------------------------------------------------------------------- -->
         
         
         
         <!-- Exercice 7 — Bordures différentes
         
         Crée une div avec :
         
         bordure haute : rouge
         bordure droite : verte
         bordure basse : bleue
         bordure gauche : jaune
         
         Objectif : border-top, border-right, etc. -->
         <div class="borduresExo7"></div>
         <!-- --------------------------------------------------------------------------------------------------------------------------------------------- -->
         


         <!-- Exercice 8 — Bordures arrondies
         
         Crée une carte avec :
         
         bordure de 2px
         coins arrondis (20px)
         
         Objectif : border-radius -->
         <div class="cardExo8"></div>
         <!-- --------------------------------------------------------------------------------------------------------------------------------------------- -->
         
         
         
         <!-- Exercice 9 — Cercle parfait
         
         Crée un cercle :
         
         largeur = hauteur = 150px
         fond coloré
         parfaitement rond
         
         Objectif : border-radius: 50% -->
         <div class="cercleExo9"></div>
         <!-- --------------------------------------------------------------------------------------------------------------------------------------------- -->
         
         
         
         <!-- Exercice 10 — Carte stylée (niveau avancé)
         
         Crée un composant "card" avec :
         
         fond blanc
         bordure légère
         coins arrondis
         image en background en haut
         texte en dessous
         
         Objectif :
         
         combiner background, border, border-radius
         structurer un composant UI réaliste --> 
         <div class="cardExo10">
            <div class="imageExo10"></div>
            <h3 class="titreExo10">Los Santos</h3>
            <p class="paraExo10">Capturer les rayons du soleil et plonger au cœur de la mer. N'attendez plus et réservez pour un voyage extraordinaire.✈️ | 🌞 | 🐚</p>
            <button class="btnExo10">Lancez-vous !</button>
         </div>
         <!-- --------------------------------------------------------------------------------------------------------------------------------------------- -->

        <button class="btn">
            <a href="../../index.html">Retour à la nav</a>
        </button>
    </main>   
</body>
</html>
